# Brand-level settings used by every deck. Edit once, applies everywhere.
company: Sparks
website: sparkscann.com
tagline: The Cannabis Listing Management Agency
one_liner: >-
  We manage your Weedmaps, Leafly, Yelp, and Google listings and ads so your
  dispensary gets found, clicked, and ordered from.

contact:
  name: Kevin Sparks
  title: Founder & CEO
  email: kevin@sparkscann.com
  phone: ""            # fill in
  booking_link: ""     # e.g. calendly link

team:
  - name: Kevin Sparks
    title: Founder & CEO
    bio: 4 years at Weedmaps working with the largest dispensaries in the world, then 3 years running listing management for Purple Lotus before founding Sparks in 2022.
  # - name: ""
  #   title: ""
  #   bio: ""

# Palette (hex, no #). Sparks brand: burnt orange + white + charcoal, taken from the
# logo (DD5F13) and the 2025 proposal deck.
palette:
  primary: "DD5F13"    # Sparks orange — orange slides, headings, icon circles
  deep: "B84C0C"       # darker orange — cards on orange slides
  secondary: "DD5F13"  # icon circles / emphasis on white slides
  accent: "FFFFFF"     # text & stats on orange slides
  soft: "FFE3D0"       # soft text on orange slides
  dim: "F0B48C"        # de-emphasized items on orange slides
  highlight: "FDE7D8"  # peach tint for callouts on white slides
  light: "F8F3EF"      # warm off-white cards
  ink: "222222"        # body text
  muted: "7A716B"      # captions
  no: "B0453A"         # "No" in comparison tables

# Logo files (relative to repo root). Regenerate variants from the orange master
# with Pillow if the logo changes — every variant is the same alpha mask recolored.
logo:
  full_orange: brand/assets/sparks-logo-orange.png      # wordmark + sparkles + "Marketplace Management"
  full_white: brand/assets/sparks-logo-white.png
  wordmark_white: brand/assets/sparks-wordmark-white.png # wordmark + sparkles, no tagline
  wordmark_orange: brand/assets/sparks-wordmark-orange.png
  icon_white: brand/assets/sparks-icon-white.png         # three sparkles only
  icon_orange: brand/assets/sparks-icon-orange.png

# Google Drive: every client's decks live in a folder named after the client under this
# "Pitch Decks" folder. src/publish_to_drive.js creates the folder and uploads the deck.
drive:
  pitch_decks_folder: "1bcAP65vMoyceh0UHXUFprdSmiOtIfTXf"   # https://drive.google.com/drive/folders/1bcAP65vMoyceh0UHXUFprdSmiOtIfTXf

# Proof points shown on the Results slide (numbers from sparkscann.com only)
proof:
  - stat: "88%"
    label: "avg. increase in order conversions in the first 90 days"
  - stat: "$17"
    label: "avg. return on every $1 of Weedmaps ad spend"
  - stat: "25%"
    label: "higher average order value than non-managed accounts"
  - stat: "100+"
    label: "dispensaries, deliveries & brands managed"

guarantee: "Results in 30 days or your money back."
