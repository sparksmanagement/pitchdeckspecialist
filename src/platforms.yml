# Per-platform pitch content. The focus platform (prospect.focus, default weedmaps)
# gets a full section; every other platform gets one preview slide in this order.
# Copy is sourced from brand/sparks.md — keep the two in sync.

order: [weedmaps, leafly, yelp, google]

weedmaps:
  name: Weedmaps
  service: Weedmaps Management
  icon: FaMapMarkedAlt
  tagline: The largest cannabis marketplace, and the one most orders start on.
  why_it_matters:
    - icon: FaSearchLocation
      title: Discovery starts here
      body: Shoppers open Weedmaps to find who's nearby, who's open, and who has the deal. If you're not in the top of the zone, you're not in the consideration set.
    - icon: FaGavel
      title: Placement is an auction
      body: Ranking in your service zone is bid-based and daily-budgeted. Bids that aren't managed drift, overpay in quiet hours, and lose the slot in busy ones.
    - icon: FaClipboardCheck
      title: The listing closes the sale
      body: Verified products, live deals, fresh photos, and answered reviews turn a click into an order. Every stale element leaks conversions.
  what_we_manage:
    - title: "Bid & budget strategy"
      body: "Daily budget pacing and bid management for top placement in every service zone"
    - title: "Listing optimization"
      body: "Hours, photos, attributes, description, and Q&A kept accurate and conversion-ready"
    - title: "Menu & product verification"
      body: "Menu management synced with your POS; every product verified"
    - title: "Deals & promotions"
      body: "Daily and monthly deal activations, BOGOs, and featured products"
    - title: "In-house graphics"
      body: "Headers, deal tiles, and product imagery designed for every ad format"
    - title: "Review management"
      body: "Same-day responses and removal requests for policy-breaking reviews"
    - title: "Brand page management"
      body: "Brand page, retailer map, and product catalog for retailers who also own a brand"
    - title: "Weekly reporting"
      body: "Performance reporting with POS-attributed revenue and ROAS"
  proof:
    stat: "$17"
    label: "average return on every $1 of Weedmaps ad spend"
  case_studies: [purple_lotus, nuna_harvest]

leafly:
  name: Leafly
  service: Leafly Management
  icon: FaLeaf
  tagline: Strain-led discovery and the second marketplace most customers check.
  why_it_matters:
    - icon: FaCannabis
      title: Strain and product search
      body: Leafly shoppers arrive knowing the strain or product they want. A verified, well-tagged menu is what puts your store in front of them.
    - icon: FaBullhorn
      title: Leafly ads and deals
      body: Paid placement, deal listings, and featured products work the same way as Weedmaps and are just as easy to leave unmanaged.
    - icon: FaStar
      title: Reviews carry weight
      body: Leafly reviews surface in Google results for your store name, so unanswered reviews cost you off-platform too.
  what_we_manage:
    - title: "Menu sync & tagging"
      body: "Product tagging across strains, brands, and categories, synced with your POS"
    - title: "Leafly Ads"
      body: "Ad strategy, budget, and creative built around ROAS"
    - title: "Deals & featured products"
      body: "Deal and featured-product activations kept current"
    - title: "Listing optimization"
      body: "Profile details and photo refresh"
    - title: "Reviews & reporting"
      body: "Review responses and monthly performance reporting"
  proof:
    stat: "+44%"
    label: "Leafly ROAS for Nuna Harvest in six months"

yelp:
  name: Yelp
  service: Yelp Management
  icon: FaYelp
  tagline: Where reviews decide, and where Sparks is one of the few cannabis partners recognized by Yelp.
  why_it_matters:
    - icon: FaStar
      title: The rating is the pitch
      body: Yelp is where shoppers compare local options on rating alone. Unanswered one-star reviews and policy-breaking reviews pull the average down.
    - icon: FaSearch
      title: Yelp ranks in Google too
      body: Your Yelp page often outranks your own site for your store name. A complete, current profile is what people see before they ever reach your menu.
    - icon: FaPhoneAlt
      title: Leads, not just clicks
      body: Yelp drives calls, direction requests, and website clicks that never show up on a marketplace dashboard. We track them.
  what_we_manage:
    - title: "Profile optimization"
      body: "Photos, categories, hours, highlights, and business details kept complete and current"
    - title: "Review management"
      body: "Responses and removal requests for guideline-breaking reviews through Sparks' recognized partner access"
    - title: "Lead tracking"
      body: "Calls, direction requests, and site visits attributed to Yelp"
    - title: "Content & updates"
      body: "Specials, announcements, and photo refreshes to keep the page active"
    - title: "Reporting"
      body: "Monthly reporting alongside your marketplace results"
  proof:
    stat: "+109%"
    label: "Yelp leads for Nuna Harvest in six months"

google:
  name: Google
  service: Google & Apple Maps Management (GBP, Ads & Local SEO)
  icon: FaGoogle
  tagline: "\"Dispensary near me\" is decided on Google Maps and Apple Maps."
  why_it_matters:
    - icon: FaMapMarkerAlt
      title: The Maps 3-pack
      body: Most local searches end in the top three Google Maps results. Getting there takes a clean Business Profile, review velocity, and citation authority.
    - icon: FaGoogle
      title: One of the few free channels
      body: With cannabis restricted on most ad platforms, your Google Business Profile is one of the only free places to reach local customers at scale.
    - icon: FaApple
      title: Apple Maps and 20+ directories
      body: iPhone users search in Apple Maps, Siri and CarPlay. Apple Business Connect plus consistent name, address and phone across 20+ directories is what tells every map you're the real one.
  what_we_manage:
    - title: "Business Profile"
      body: "Claim, cleanup, and optimization of your Google Business Profile"
    - title: "Posts, photos & reviews"
      body: "Weekly Google Posts, photo refresh, Q&A, and review responses"
    - title: "Google Ads"
      body: "Compliant campaigns where the market allows"
    - title: "Apple Maps & 20+ directories"
      body: "Apple Business Connect (Apple Maps, Siri, CarPlay) plus NAP consistency across 20+ directories"
    - title: "Map-pack tracking"
      body: "Ranking tracking with a Top 3 goal in 90 days"
  proof:
    stat: "Top 3"
    label: "Google Maps ranking goal within 90 days"
