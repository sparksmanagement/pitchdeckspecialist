# Verified on the live listings (headless browser, Nov 17 2026) unless marked "per".
audit:
  - platform: "Weedmaps · Milford"
    finding: "Listing tagged \"In-store purchases only\" — no online ordering through Weedmaps; 4 photos; no deals (\"No Deals Available\"); the only review we can see is from June 2023; the hero banner still announces non-medical sales as new (they started Aug 2024)."
    impact: "859 products on a live menu that can't be ordered; a two-year-old banner and one review tell shoppers the listing isn't managed"
  - platform: "Weedmaps · Mt. Orab"
    finding: "\"In-store purchases only\", 5 photos, no deals on Weedmaps (Leafly carries a 15% Tue/Thu deal the Weedmaps listing doesn't), no visible store rating, same 2024 \"available now\" banner."
    impact: "Shoppers comparing Mt. Orab stores on Weedmaps see no deal and no rating next to a 975-product menu"
  - platform: "Weedmaps · Miamitown"
    finding: "New listing (Oct 2026): 7 photos, \"Now open\" banner, 934 products, no deals, no reviews yet, \"In-store purchases only\"."
    impact: "The newest store has no Weedmaps orders, reviews or deals to build momentum in the west-side zone"
  - platform: "Leafly · Listings"
    finding: "Mt. Orab 4.9★ (12 reviews/ratings, 109 followers, 1 deal); Milford 4.6★ (11 reviews, 65 followers, no deals, 4 products showing \"Image Not Found\"); Miamitown 5.0★ (2 reviews). Menus can't be ordered through Leafly (local rules) — they link out to your site."
    impact: "Three healthy ratings with thin review counts and missing product images; deals and menu hygiene differ store to store"
  - platform: "Yelp · Profiles"
    finding: "Per Yelp (search snippet, Jun 2026): Milford 3.0★ from 9 reviews; Mt. Orab 4.3★ from 4 reviews. Yelp blocks automated access, so these are to confirm on the call."
    impact: "A 3.0★ Yelp page for Milford is the first thing a name search shows — unanswered reviews are pulling the average down"
  - platform: "Google · Business Profiles"
    finding: "Live Google Maps (Nov 17): Milford 4.8★, Mt. Orab 4.8★, Miamitown 4.9★. Review counts aren't visible to us; a directory lists ~1,600 (Milford) and ~1,870 (Mt. Orab) per Local Dispensary Guide — please confirm, and whether all three profiles are claimed."
    impact: "Your biggest review base by far is on Google; posts, photos and replies there feed the Maps 3-pack for every store"

