# NUG — California vertically integrated cannabis company (dispensaries, delivery, brand).
# Pitch scope: Weedmaps management only. Build: npm run build -- prospects/nug.yml

prospect:
  name: "NUG"
  type: dispensary
  type_label: "dispensary, delivery and brand operation"
  focus: weedmaps               # full section; other platforms shown as add-ons
  city: "Oakland"
  state: "CA"
  locations: 7                 # Sacramento, Oakland, San Leandro, Alameda, Riverside, Vallejo (CCC powered by NUG), Red Bluff
  website: "nug.com"
  contact_name: ""
  contact_title: ""
  date: ""

# Verified on the live Weedmaps listings (headless browser, Sept 14 2026).
audit:
  - platform: "Weedmaps · Sacramento"
    finding: "Listed as \"Community Health Solutions - Sacramento\" — the header image says it too. 4.7★ / 1,145 reviews, 1,954 products"
    impact: "The flagship store doesn't carry the NUG name; brand searches and reviews are split"
  - platform: "Weedmaps · Vallejo"
    finding: "Listed as \"California Collective Care\"; online ordering stops at 7:00pm while the store is open until 10:00pm"
    impact: "Three hours of open-store time with no online orders, every day"
  - platform: "Weedmaps · Riverside"
    finding: "Page shows \"The Artist Tree\", browser title \"Biomass Industries, LLC\", logo says NUG. 4.6★ / 10 reviews, pickup only"
    impact: "Three names on one listing; the June 1-star review has no reply"
  - platform: "Weedmaps · Alameda"
    finding: "4.8★ but only 41 reviews, a single photo, and the same expired Labor Day header"
    impact: "Thin social proof and a stale, one-photo profile in a newer zone"
  - platform: "Weedmaps · Red Bluff & San Leandro"
    finding: "Red Bluff: 4.3★ from 8 reviews, lowest in the chain. San Leandro (4.7★ / 577) is the only NUG listing that answers reviews"
    impact: "The playbook that works in San Leandro isn't applied anywhere else"

# NUG Oakland on an iPhone with numbered callouts (slide 5). Real screenshot captured from
# weedmaps.com/dispensaries/nug-oakland on Sept 14 2026.
audit_mock:
  listing: "NUG Oakland (weedmaps.com/dispensaries/nug-oakland)"
  subtitle: "Dispensary · Oakland, CA · Medical & Recreational"
  rating: "4.7"
  reviews: "59 reviews"
  badges: ["Order online", "Pickup"]
  deals: "Monday Deals..."
  menu: "838 products · Live menu"
  reviews_line: "No owner replies"
  screenshot: "prospects/assets/nug-oakland-weedmaps.png"
  fleet_title: "Across the other 6 listings"
  callouts:
    - at: [0.9, 0.073]
      title: "Still promoting Labor Day"
      text: "The Labor Day Sale header (Sept 3–7) is still the hero image a week after it ended — on Oakland, Alameda, Vallejo and Riverside."
    - at: [0.9, 0.72]
      title: "\"Monday Deals…\" says nothing"
      text: "One deal tile with a generic tag icon and no detail. Shoppers can't see what's on sale without clicking through."
    - at: [0.9, 0.884]
      title: "On-sale products aren't featured"
      text: "Items carrying –20% badges sit buried in the menu; nothing is surfaced as a featured product above the fold."
    - at: [0.9, 0.423]
      title: "Only 59 reviews"
      text: "4.7★ from 59 reviews for a downtown store that's been open for years, and none of them answered."
    - at: [0.37, 0.95]
      title: "Products missing verification"
      text: "838-item menu with product verifications missing — unverified SKUs drop out of brand-filtered search."

market:
  competitors_in_zone:          # left blank: seven zones, counts vary — panel shows location count instead
  notes: "Seven NUG Weedmaps listings across Northern and Southern California plus a brand page — three of them don't carry the NUG name today. One strategy, one bidding model, one report."

services:
  weedmaps:
    include: true
    notes: "Ad spend & bid management across all 7 listings, listing optimization, deal & promotion activations, in-house graphics, menu management & product verification, review responses and removals, weekly reporting."
  leafly:
    include: false
    notes: ""
  yelp:
    include: false
    notes: ""
  google:
    include: false
    gbp: false
    ads: false
    notes: ""
  local_seo:
    include: false
    notes: ""
  other:
    - name: "Weedmaps Brand Page"
      notes: "Brand page management: verified products, retailer map, brand deals and events feed synced with NUG-owned menus."

investment:
  monthly_fee: ""
  trial: "Free 30-day trial — no invoice until day 31. Zero risk to start."
  ad_spend_note: "Ad spend is billed directly by each platform; Sparks manages allocation and bidding."
  term: "Month-to-month after the 90-day launch"
  options:                      # the three cards on the Investment slide
    - name: "Weedmaps Management"
      price: "$995/mo"
      alt: "or 10% of Weedmaps ad spend once spend exceeds $9,995/mo"
      includes: "Full Weedmaps management across all 7 listings + brand page: bids, listings, menus, deals, graphics, reviews, weekly reporting"
    - name: "Listing Bundle"
      price: "$495/mo"
      alt: "or 10% of ad spend if any platform's spend exceeds $4,950/mo"
      includes: "Leafly + Yelp + Google management added to Weedmaps — same seven pillars on every platform"
      optional: true
    - name: "Total Package"
      price: "$1,490/mo"
      alt: "or 10% of ad spend where the spend thresholds are exceeded"
      includes: "Weedmaps + Leafly + Yelp + Google. Every platform your customers use, one team, one report."
      recommended: true
  addon:                        # one bundle price for every non-focus platform
    label: "Leafly + Yelp + Google"
    price: "$495/mo"
    detail: "One fee for all three platforms; scales to 10% of ad spend if any platform's spend exceeds $4,950/mo"
  total:
    label: "Total package"
    price: "$1,490/mo"
    detail: "Weedmaps + Leafly + Yelp + Google, unless the 10%-of-ad-spend rule applies"

plan:
  - period: "Days 1–30"
    items: "Pull expired banners, rebuild deal tiles and featured products, fix naming on Sacramento, Vallejo and Riverside, verify menus, launch bids in every zone"
  - period: "Days 31–60"
    items: "Deal and promo cadence, review program, creative refresh, POS-integrated dashboard live"
  - period: "Days 61–90"
    items: "Scale winning zones, brand-page campaigns, delivery bids, quarterly plan"

case_studies: [purple_lotus, nuna_harvest]
