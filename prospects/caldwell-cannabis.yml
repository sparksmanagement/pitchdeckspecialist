# Verified on the live Weedmaps listing (headless browser, Oct 15 2026) unless marked "per".
audit:
  - platform: "Weedmaps · Listing"
    finding: "5.0★ from 36 reviews (97% five-star) and two live deals — the strongest listing we've audited. One owner reply."
    impact: "The rating is an asset; the gaps below are what keep it from converting more of Queens and Nassau"
  - platform: "Weedmaps · Delivery"
    finding: "Listing is \"Storefront | Pickup\" only, yet the header reads \"WE DELIVER — Long Beach, Atlantic Beach, Far Rockaway, Queens, Nassau County\"."
    impact: "No Weedmaps delivery listing means zero delivery orders from the platform in the zones you already serve"
  - platform: "Weedmaps · Location"
    finding: "Listed under \"New York City\" with no Far Rockaway or Queens in the name; address \"2-29A\" vs \"229A\" across directories."
    impact: "Shoppers searching Far Rockaway or Long Beach don't see the neighborhood; map pins drift"
  - platform: "Leafly · Listing"
    finding: "5.0★ (22 reviews + 6 ratings, live Oct 15), 14 followers, 207 products, 3 deals. Hours show Thu/Fri 10am–5pm vs 10am–8pm on your site. A review mentions 10% off for posting a Google or Leafly review."
    impact: "Wrong hours cost evening orders two days a week; incentivized reviews breach Google's policy and risk removal"
  - platform: "Yelp · Profile"
    finding: "Page is live with 14 photos; rating and review count aren't visible to us (Yelp blocks automated access) — to confirm on the call."
    impact: "Yelp is the page that shows up for name searches; worth knowing where it stands before the bundle"
  - platform: "Google · Business Profile"
    finding: "5.0★ from 204 reviews (live Google, Oct 15) — but the profile shows \"Own this business?\", so it appears unclaimed; hours and address formats conflict across directories."
    impact: "Your biggest review base sits on a profile nobody controls; claiming it unlocks posts, photos, replies and the Maps 3-pack"

