# Example prospect — safe to delete. Built with: npm run build -- prospects/example-green-valley.yml


prospect:
  name: "Green Valley Dispensary"
  type: dispensary            # dispensary | delivery | brand
  focus: weedmaps
  city: "Sacramento"
  state: "CA"
  locations: 1
  website: ""
  contact_name: "Jordan Lee"            # who we're pitching (owner / GM / marketing lead)
  contact_title: "Owner"
  date: ""                    # leave blank for today's date

# What we found when we looked at their listings. Drives the Problem and
# Opportunity slides. Delete rows you don't have data for.
audit:
  - platform: Weedmaps
    finding: "Listing live but no paid placement; 40% of menu unverified"
    impact: "Buried below 6 competitors in the service zone"
  - platform: Leafly
    finding: "Menu last synced 3 weeks ago; no deals running"
    impact: "Out-of-stock items still showing; lost orders"
  - platform: Yelp
    finding: "4 unanswered 1-star reviews; profile incomplete"
    impact: "3.4 rating vs 4.5 market average"
  - platform: Google
    finding: "GBP not claimed / wrong hours; 0 posts in 6 months"
    impact: "Not in the Maps 3-pack for 'dispensary near me'"

# Local context for the "Where Your Customers Are" slide.
market:
  competitors_in_zone: 8
  notes: "High-density market; Weedmaps and Google Maps drive most discovery."

# ── SERVICES ── every deck must address all six. Set include true/false and
# add notes describing exactly what we'll do for THIS prospect.
services:
  weedmaps:
    include: true
    notes: "All listings on the platform: ad spend & bid management, listing optimization, deal & promotion activations, in-house graphics, menu management & product verification, review responses, weekly reporting."  # speaker notes only; the scope slide says the services cover every listing on the platform
  leafly:
    include: true
    notes: "Menu sync with POS, Leafly ads, deal activations, review management."
  yelp:
    include: true
    notes: "Profile optimization, review responses and removal requests, lead tracking."
  google:
    include: true
    gbp: true
    ads: false                # true only if compliant Google Ads are in scope
    notes: "Claim & optimize GBP, weekly Google Posts, photo refresh, Q&A, review response. Target: Maps 3-pack in 90 days."
  local_seo:
    include: true
    notes: "NAP cleanup and citations across 20+ directories, voice-assistant visibility."
  other:                      # free-form extras; leave list empty [] if none
    - name: "Programmatic Advertising"
      notes: "Geo-fenced display + CTV within 5 miles via compliant DSPs; retargeting listing visitors."

# Investment / engagement. Blank pricing renders as "Custom proposal".
investment:
  monthly_fee: ""
  addon_price: "$495/mo"             # e.g. "$2,500/mo"
  ad_spend_note: "Ad spend billed directly by platforms; Sparks manages allocation."
  term: "Month-to-month after 90-day launch"
  options:
    - name: "Single Platform Management"
      summary: "Single Platform (Weedmaps)"
      price: "$495/mo"
      alt: "or 10% of that platform's ad spend once it exceeds $4,950/mo"
      includes: "Any one platform — Weedmaps in this proposal: bids, listings, menus, deals, graphics, reviews, weekly reporting"
    - name: "Listing Bundle"
      price: "+$495/mo"
      alt: "or 10% of ad spend if any platform's spend exceeds $4,950/mo"
      includes: "Every other platform: Leafly + Yelp + Google + Apple Maps and 20 directories — same seven pillars everywhere"
      optional: true
    - name: "Total Package"
      price: "$990/mo"
      alt: "or 10% of ad spend where the spend thresholds are exceeded"
      includes: "Every marketplace, map and directory your customers use — one team, one report."
      recommended: true

# 30/60/90 plan shown on the Next Steps slide. Defaults are fine for most decks.
plan:   # Sparks standard process; keep the four steps, tailor the launch line if useful
  - period: "Kickoff"
    items: "Meet with your team to align on goals, account info, deals, menu and brand assets; connect every platform; set up your analytics dashboard"
  - period: "Days 1–30  ·  Launch"
    items: "Full audit, strategy, listing and menu clean-up, products verified and strain tagged, deals and campaigns live"
  - period: "Days 31–60  ·  Measure & optimize"
    items: "Measure what the launch did to orders and return, then re-tune positions, deals, products and graphics to improve it"
  - period: "Days 61–90 and beyond  ·  Repeat & grow"
    items: "Rinse and repeat every month: measure, adjust, improve — continually growing and maximizing your return; add-on platforms switched on when you're ready"

# Optional: pick which case studies to feature (keys from src/case_studies.yml)
case_studies: [purple_lotus, nuna_harvest]
