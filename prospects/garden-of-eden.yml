    include: false
    notes: ""
  google:
    include: false
    gbp: false
    ads: false
    notes: ""
  local_seo:
    include: false
    notes: ""
  other: []

investment:
  monthly_fee: ""
  trial: "Free 30-day trial — no invoice until day 31. Zero risk to start."
  ad_spend_note: "Ad spend is billed directly by each platform; Sparks manages allocation and bidding."
  term: "Month-to-month after the 90-day launch"
  options:
    - name: "Weedmaps Management"
      price: "$995/mo"
      alt: "or 10% of Weedmaps ad spend once spend exceeds $9,995/mo"
      includes: "Full Weedmaps management across all 4 listings: bids, listings, menus, deals, graphics, reviews, weekly reporting"
    - name: "Listing Bundle"
      price: "$495/mo"
      alt: "or 10% of ad spend if any platform's spend exceeds $4,950/mo"
      includes: "Leafly + Yelp + Google + Apple Maps and 20 directories, added to Weedmaps — same seven pillars everywhere"
      optional: true
    - name: "Total Package"
      price: "$1,490/mo"
      alt: "or 10% of ad spend where the spend thresholds are exceeded"
      includes: "Every marketplace, map and directory your customers use — one team, one report."
