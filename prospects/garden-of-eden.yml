plan:
  - period: "Days 1–30"
    items: "Deal tiles and featured products on all 4 listings, ordering extended to close, review program live, menus verified, bids launched in Hayward and Tracy"
  - period: "Days 31–60"
    items: "Deal cadence, creative refresh, delivery-zone bids for Manteca, Lathrop and Mountain House, POS-integrated dashboard live"
  - period: "Days 61–90"
    items: "Scale winning zones, review velocity to match Google, quarterly plan"

case_studies: [purple_lotus, nuna_harvest]
