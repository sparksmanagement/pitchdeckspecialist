    include: true
    notes: "Ad spend & bid management across all 4 listings (2 storefronts + 2 delivery zones), listing optimization, deal & promotion activations, in-house graphics, menu management & product verification, review responses, weekly reporting."
  leafly:
    include: false
    notes: ""
