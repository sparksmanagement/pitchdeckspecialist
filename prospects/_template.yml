# ─────────────────────────────────────────────────────────────────────────────
# Prospect intake — copy this file to prospects/<slug>.yml and fill it in.
# Anything left blank is either hidden or replaced with a sensible default.
# Build: npm run build -- prospects/<slug>.yml
# ─────────────────────────────────────────────────────────────────────────────

prospect:
  name: "Business Name"
  type: dispensary            # dispensary | delivery | brand
  type_label: ""              # optional free text, e.g. "dispensary, delivery and brand operation"
  focus: weedmaps             # platform that gets the full pitch; others become one-slide previews
  city: "City"
  state: "ST"
  locations: 1
  website: ""
  contact_name: ""            # who we're pitching (owner / GM / marketing lead)
  contact_title: ""
  date: ""                    # leave blank for today's date

# What we found when we looked at their listings. Drives the Problem and
# Opportunity slides. Delete rows you don't have data for.
audit:
  - platform: Weedmaps
    finding: "Listing live but no paid placement; 40% of menu unverified"
    impact: "Buried below 6 competitors in the service zone"
  - platform: Leafly
    finding: "Menu last synced 3 weeks ago; no deals running"
    impact: "Out-of-stock items still showing; lost orders"
  - platform: Yelp
    finding: "4 unanswered 1-star reviews; profile incomplete"
    impact: "3.4 rating vs 4.5 market average"
  - platform: Google
    finding: "GBP not claimed / wrong hours; 0 posts in 6 months"
    impact: "Not in the Maps 3-pack for 'dispensary near me'"

# Optional: replaces the audit table with an iPhone mockup of the worst listing plus
# numbered callouts. `section` places the marker: name | rating | badges | deals | menu | reviews.
# Put a real screenshot at `screenshot` (PNG/JPG, portrait) to use it instead of the mockup;
# markers then use `at: [x, y]` as fractions of the screen (0–1).
# audit_mock:
#   listing: "Business Name - City"
#   subtitle: "Dispensary · City, ST"
#   rating: "4.2"
#   reviews: "18 reviews"
#   badges: ["Order online", "Pickup"]
#   deals: "No deals listed"
#   menu: "212 items · verification to confirm"
#   reviews_line: "3 unanswered reviews"
#   screenshot: ""
#   callouts:
#     - section: name
#       title: "Listing name doesn't match the brand"
#       text: "Shoppers searching the brand may not connect this page to it."
#   fleet_title: "Across all locations"      # heading for the remaining audit rows

# Local context for the "Where Your Customers Are" slide.
market:
  competitors_in_zone: 8
  notes: "High-density market; Weedmaps and Google Maps drive most discovery."

# ── SERVICES ── every deck must address all six. Set include true/false and
# add notes describing exactly what we'll do for THIS prospect.
services:
  weedmaps:
    include: true
    notes: "Bid strategy for top-3 placement in zone, full menu verification, weekly deal rotation, review responses, weekly reporting."
  leafly:
    include: true
    notes: "Menu sync with POS, Leafly ads, deal activations, review management."
  yelp:
    include: true
    notes: "Profile optimization, review responses and removal requests, lead tracking. (No Yelp Ads — not available to cannabis right now.)"
  google:
    include: true
    gbp: true
    ads: false                # true only if compliant Google Ads are in scope
    notes: "Claim & optimize GBP, weekly Google Posts, photo refresh, Q&A, review response. Target: Maps 3-pack in 90 days."
  local_seo:
    include: true
    notes: "NAP cleanup and citations across 20+ directories, voice-assistant visibility."
  other:                      # free-form extras; leave list empty [] if none
    - name: "Programmatic Advertising"
      notes: "Geo-fenced display + CTV within 5 miles via compliant DSPs; retargeting listing visitors."

# Investment / engagement. Two ways to price the non-focus platforms:
#   addon_price  — per platform ("$495/mo each")            [used when `addon` is absent]
#   addon        — one bundle for all non-focus platforms    [preferred; add `total` for the package]
investment:
  monthly_fee: ""             # single price, used when options is empty
  trial: ""                   # e.g. "Free 30-day trial — no invoice until day 31. Zero risk to start." (keep under ~65 chars)
  addon_price: "$495/mo"
  addon:
    label: "Leafly + Yelp + Google"
    price: "$495/mo"
    detail: "One fee for all three platforms; scales to 10% of ad spend if any platform's spend exceeds $4,950/mo"
  total:
    label: "Total package"
    price: "$1,490/mo"
    detail: "Weedmaps + Leafly + Yelp + Google, unless the 10%-of-ad-spend rule applies"
  ad_spend_note: "Ad spend is billed directly by each platform; Sparks manages allocation and bidding."
  term: "Month-to-month after the 90-day launch"
  options:                    # up to 3 cards on the Investment slide; leave [] to auto-build from monthly_fee + addon + total
    - name: "Weedmaps Management"
      price: "$995/mo"
      alt: "or 10% of Weedmaps ad spend once spend exceeds $9,995/mo"
      includes: "Full Weedmaps management: bids, listings, menus, deals, graphics, reviews, weekly reporting"
    - name: "Listing Bundle"
      price: "$495/mo"
      alt: "or 10% of ad spend if any platform's spend exceeds $4,950/mo"
      includes: "Leafly + Yelp + Google management added to Weedmaps"
      optional: true          # shows "(optional)" in the next-steps summary
    - name: "Total Package"
      price: "$1,490/mo"
      alt: "or 10% of ad spend where the spend thresholds are exceeded"
      includes: "Weedmaps + Leafly + Yelp + Google. Every platform your customers use, one team, one report."
      recommended: true       # highlighted card

# 30/60/90 plan shown on the Next Steps slide. Defaults are fine for most decks.
plan:
  - period: "Days 1–30"
    items: "Full audit, strategy, listing + menu clean-up, campaigns live"
  - period: "Days 31–60"
    items: "Bid & deal optimization, review program, dashboard attribution"
  - period: "Days 61–90"
    items: "Scale winners, Maps 3-pack push, quarterly plan"

# Optional: pick which case studies to feature (keys from src/case_studies.yml)
case_studies: [purple_lotus, nuna_harvest]
